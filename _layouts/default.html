<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if site.adsense_client != "" %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client }}" crossorigin="anonymous"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">글 목록</a>
        <a href="{{ '/about/' | relative_url }}">소개</a>
        <a href="{{ '/contact/' | relative_url }}">문의</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ 'now' | date: "%Y" }} {{ site.title }}</p>
      <p>
        <a href="{{ '/about/' | relative_url }}">소개</a> ·
        <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a> ·
        <a href="{{ '/contact/' | relative_url }}">문의</a> ·
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </p>
    </div>
  </footer>
</body>
</html>
